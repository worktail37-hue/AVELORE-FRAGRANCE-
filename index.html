<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3B0000" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Primary Title & Meta Description -->
    <title>Avelore | Luxury Perfumes, Body, Home &amp; Beauty</title>
    <meta
      name="description"
      content="Avelore is an independent luxury fragrance house crafting artisanal perfumes, body and bath care, botanical beauty, and home scents with rare Grasse harvests."
    />
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- OpenGraph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avelore" />
    <meta property="og:title" content="Avelore | Luxury Perfumes, Body, Home &amp; Beauty" />
    <meta
      property="og:description"
      content="Avelore is an independent luxury fragrance house crafting artisanal perfumes, body and bath care, botanical beauty, and home scents with rare Grasse harvests."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:locale" content="en" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avelore | Luxury Perfumes, Body, Home &amp; Beauty" />
    <meta
      name="twitter:description"
      content="Avelore is an independent luxury fragrance house crafting artisanal perfumes, body and bath care, botanical beauty, and home scents with rare Grasse harvests."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />

    <!-- Icons & Web Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Core Web Vitals LCP Preload: Hero Poster Image -->
    <link
      rel="preload"
      href="/hero-poster.jpg"
      as="image"
      type="image/jpeg"
      fetchpriority="high"
    />

    <!-- Google Fonts Optimization: Preconnect & display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF2E1] text-[#3B0000] antialiased selection:bg-[#3B0000] selection:text-[#FFD482] font-sans overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
